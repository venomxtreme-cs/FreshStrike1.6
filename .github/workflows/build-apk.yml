name: Build FreshStrike APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*', '1.36.*' ]
  workflow_dispatch:

# Build only. The workflow cannot push, create releases or edit the repo.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleGitRelease -Pfreshstrike.updateRepo=${{ github.repository }}

      - name: Prepare artifact
        run: cp app/build/outputs/apk/git/release/app-git-release.apk FreshStrike1.6.apk

      - name: Verify version and signature
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          EXPECTED_NUM="$(tr -d '[:space:]' < build-number.txt)"
          EXPECTED_NAME="1.36.${EXPECTED_NUM}-$(git rev-parse --short HEAD)"
          BADGING="$("$BUILD_TOOLS/aapt2" dump badging FreshStrike1.6.apk | head -n 1)"
          PKG="$(printf '%s\n' "$BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")"
          VER="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          echo "package=$PKG version=$VER expected=$EXPECTED_NAME"
          test "$PKG" = "su.xash.cs16clientamxx"
          test "$VER" = "$EXPECTED_NAME"
          CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs FreshStrike1.6.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          echo "signer=$CERT"
          test "$CERT" = "cf2a42e1868a902ab162c01cf7e763728ad5439048fc2e7a758421e6319ae1f2"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreshStrike1.6
          path: FreshStrike1.6.apk
          if-no-files-found: error
