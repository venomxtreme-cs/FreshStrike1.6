name: Build FreshStrike APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*', '1.36.*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleGitRelease -Pfreshstrike.updateRepo=${{ github.repository }}

      - name: Prepare artifact
        run: cp app/build/outputs/apk/git/release/app-git-release.apk FreshStrike1.6.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreshStrike1.6
          path: FreshStrike1.6.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: FreshStrike1.6.apk
          generate_release_notes: true
